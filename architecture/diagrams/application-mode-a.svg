<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1131" viewBox="0 0 1450 1131" role="img" aria-labelledby="title desc">
<title id="title">Authentication and Mode A - Reference API</title><desc id="desc">Unauthorized requests return 401/403 and are not forwarded. Adapter initiates HTTPS over Direct Connect. Internal service calls use TLS.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#334155"/></marker></defs>
<rect width="1450" height="1131" fill="white"/>
<text x="30" y="34" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Authentication and Mode A - Reference API</text>
<rect x="55.0" y="55" width="219.3" height="991" rx="8" fill="#eff6ff"/>
<text x="166.7" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Data centre</text>
<text x="166.7" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Legacy application</text>
<line x1="166.7" y1="137" x2="166.7" y2="1031" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="278.3" y="55" width="219.3" height="991" rx="8" fill="#eff6ff"/>
<text x="390.0" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">Data centre</text>
<text x="390.0" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Adapter</text>
<line x1="390.0" y1="137" x2="390.0" y2="1031" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="501.7" y="55" width="219.3" height="991" rx="8" fill="#f0fdf4"/>
<text x="613.3" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">AWS</text>
<text x="613.3" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#0f172a">NLB / NGINX</text>
<line x1="613.3" y1="137" x2="613.3" y2="1031" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="725.0" y="55" width="219.3" height="991" rx="8" fill="#f0fdf4"/>
<text x="836.7" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">AWS</text>
<text x="836.7" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Keycloak</text>
<line x1="836.7" y1="137" x2="836.7" y2="1031" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="948.3" y="55" width="219.3" height="991" rx="8" fill="#f0fdf4"/>
<text x="1060.0" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">AWS</text>
<text x="1060.0" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#0f172a">JWT authorization</text>
<line x1="1060.0" y1="137" x2="1060.0" y2="1031" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="1171.7" y="55" width="219.3" height="991" rx="8" fill="#f0fdf4"/>
<text x="1283.3" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">AWS</text>
<text x="1283.3" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Reference API</text>
<line x1="1283.3" y1="137" x2="1283.3" y2="1031" stroke="#94a3b8" stroke-dasharray="5 5"/>
<rect x="30" y="143" width="1390" height="30" fill="#e2e8f0"/>
<text x="45" y="163" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Get a token</text>
<line x1="390.0" y1="244" x2="613.3333333333334" y2="244" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="501.6666666666667" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">1. HTTPS token request with client</text>
<text x="501.6666666666667" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">credentials</text>
<line x1="613.3333333333334" y1="292" x2="836.6666666666667" y2="292" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="725.0" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">2. Forward token request</text>
<line x1="836.6666666666667" y1="357" x2="613.3333333333334" y2="357" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="725.0" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">3. Short-lived token</text>
<line x1="613.3333333333334" y1="422" x2="390.0" y2="422" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="501.6666666666667" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">4. Return token</text>
<rect x="30" y="451" width="1390" height="30" fill="#e2e8f0"/>
<text x="45" y="471" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Retrieve reference data</text>
<line x1="166.66666666666669" y1="552" x2="390.0" y2="552" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="278.33333333333337" y="511" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">5. Request through existing</text>
<text x="278.33333333333337" y="528" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">interface</text>
<line x1="390.0" y1="617" x2="613.3333333333334" y2="617" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="501.6666666666667" y="576" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">6. GET /api/reference, token and</text>
<text x="501.6666666666667" y="593" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">request_id</text>
<line x1="613.3333333333334" y1="665" x2="1060.0" y2="665" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="836.6666666666667" y="641" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">7. Check signature, issuer, audience, expiry and scope</text>
<line x1="1060.0" y1="730" x2="613.3333333333334" y2="730" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="836.6666666666667" y="706" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">8. Authorization decision</text>
<line x1="613.3333333333334" y1="795" x2="1283.3333333333335" y2="795" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="948.3333333333335" y="771" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">9. Forward authorized request</text>
<line x1="1283.3333333333335" y1="860" x2="613.3333333333334" y2="860" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="948.3333333333335" y="836" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">10. Reference data</text>
<line x1="613.3333333333334" y1="925" x2="390.0" y2="925" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="501.6666666666667" y="901" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">11. HTTPS response</text>
<line x1="390.0" y1="1007" x2="166.66666666666669" y2="1007" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="278.33333333333337" y="966" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">12. Return through existing</text>
<text x="278.33333333333337" y="983" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#0f172a">interface</text>
<text x="30" y="1063" font-family="Arial,sans-serif" font-size="13" fill="#475569">Unauthorized requests return 401/403 and are not forwarded. Adapter initiates HTTPS over Direct Connect. Internal service calls use TLS.</text>
</svg>